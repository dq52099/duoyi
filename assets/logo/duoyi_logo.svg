      <path d="M 244 374 C 288 344, 344 334, 386 344 C 400 348, 396 368, 374 380 C 330 404, 280 434, 224 456 C 266 426, 312 396, 348 374 C 314 370, 276 376, 244 374 Z"/>
      <path d="M 250 442 C 296 414, 352 404, 392 414 C 406 418, 402 440, 376 456 C 324 488, 276 530, 220 568 C 258 524, 304 480, 348 446 C 314 446, 274 466, 230 494 C 252 470, 276 452, 250 442 Z"/>
