    <rect x="556" y="394" width="16" height="30" rx="8" fill="#FFA43B"/>
    <rect x="556" y="660" width="16" height="30" rx="8" fill="#FFA43B"/>
    <rect x="416" y="534" width="30" height="16" rx="8" fill="#FFA43B"/>
    <rect x="682" y="534" width="30" height="16" rx="8" fill="#FFA43B"/>
    <path d="M 494 544 L 542 592 L 640 492" fill="none" stroke="#C95638" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>
    <path d="M 494 538 L 542 586 L 640 486" fill="none" stroke="#FF6448" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>

