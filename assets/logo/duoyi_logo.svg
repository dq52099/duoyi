    <path d="M 184 542 C 42 606, 44 748, 214 756 C 350 762, 378 708, 434 756 C 492 806, 588 800, 720 724 C 814 670, 886 612, 916 540" fill="none" stroke="#FFFDF8" stroke-width="58" stroke-linecap="round"/>
    <path d="M 184 542 C 54 602, 56 738, 218 746 C 352 752, 378 698, 434 746 C 492 796, 588 790, 720 714 C 814 660, 886 602, 916 530" fill="none" stroke="url(#ribbonGrad)" stroke-width="40" stroke-linecap="round"/>

