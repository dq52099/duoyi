name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: '覆盖 DUOYI_SERVER_URL (留空走仓库变量/默认值)'
        required: false
        default: ''
      build_web:
        description: '是否同时构建 web 产物'
        required: false
        default: 'false'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'
  JAVA_VERSION: '17'

jobs:
  # ─────────────────────────────────────────────
  # 1. Analyze & test
  # ─────────────────────────────────────────────
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests (if any)
        run: |
          if [ -d test ] && [ -n "$(ls -A test 2>/dev/null)" ]; then
            flutter test --no-pub
          else
            echo "No tests found, skipping."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s backend

  # ─────────────────────────────────────────────
  # 2. Android APK / AAB
  # ─────────────────────────────────────────────
  android:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DUOYI_SERVER_URL: ${{ github.event.inputs.server_url || vars.DUOYI_SERVER_URL || '' }}
      HAS_KEYSTORE: ${{ secrets.DUOYI_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Get packages
        run: flutter pub get

      # Only restore real keystore when the secret is present.
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.DUOYI_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.DUOYI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DUOYI_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.DUOYI_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keys
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keys/duoyi-release.jks
          {
            printf 'storeFile=keys/duoyi-release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PWD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PWD"
          } > android/key.properties
          echo "Keystore restored."

      - name: Require release keystore
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::DUOYI_KEYSTORE_BASE64 missing; refusing to build release artifacts with debug signing."
          exit 1

      - name: Build APK (release, split per ABI)
        run: |
          DART_DEFINES=""
          if [ -n "$DUOYI_SERVER_URL" ]; then
            DART_DEFINES="--dart-define=DUOYI_SERVER_URL=$DUOYI_SERVER_URL"
            echo "Using DUOYI_SERVER_URL=$DUOYI_SERVER_URL"
          fi
          flutter build apk --release --split-per-abi $DART_DEFINES

      - name: Build universal APK (release)
        run: |
          DART_DEFINES=""
          if [ -n "$DUOYI_SERVER_URL" ]; then
            DART_DEFINES="--dart-define=DUOYI_SERVER_URL=$DUOYI_SERVER_URL"
          fi
          flutter build apk --release $DART_DEFINES

      - name: Build App Bundle (release, tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          DART_DEFINES=""
          if [ -n "$DUOYI_SERVER_URL" ]; then
            DART_DEFINES="--dart-define=DUOYI_SERVER_URL=$DUOYI_SERVER_URL"
          fi
          flutter build appbundle --release $DART_DEFINES

      - name: Stage artifacts
        id: stage
        run: |
          mkdir -p artifacts
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF##refs/tags/}"
          else
            SUFFIX="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "Suffix: $SUFFIX"
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"

          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "artifacts/duoyi-$SUFFIX.apk"
          fi
          for abi in armeabi-v7a arm64-v8a x86_64; do
            SRC="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ -f "$SRC" ]; then
              cp "$SRC" "artifacts/duoyi-$SUFFIX-$abi.apk"
            fi
          done
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "artifacts/duoyi-$SUFFIX.aab"
          fi

          ls -lh artifacts

      - name: Verify staged APK versionCodes
        env:
          SUFFIX: ${{ steps.stage.outputs.suffix }}
        run: |
          AAPT2=""
          for sdk_root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
            if [ -n "$sdk_root" ] && [ -d "$sdk_root/build-tools" ]; then
              candidate="$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)"
              if [ -n "$candidate" ] && [ -x "$candidate" ]; then
                AAPT2="$candidate"
                break
              fi
            fi
          done
          if [ -z "$AAPT2" ]; then
            AAPT2="$(command -v aapt2 || true)"
          fi
          if [ -z "$AAPT2" ] || [ ! -x "$AAPT2" ]; then
            echo "::error::Android SDK aapt2 not found under ANDROID_HOME/ANDROID_SDK_ROOT."
            exit 1
          fi
          echo "Using aapt2: $AAPT2"

          AAPT2="$AAPT2" SUFFIX="$SUFFIX" python3 - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          aapt2 = os.environ["AAPT2"]
          suffix = os.environ["SUFFIX"]
          pubspec = pathlib.Path("pubspec.yaml").read_text(encoding="utf-8")
          m_pub = re.search(r"^version:\s*([^\s+]+)\+(\d+)\s*$", pubspec, re.M)
          if not m_pub:
              raise SystemExit("ERROR: Could not parse version: <name>+<build> from pubspec.yaml")
          expected_name = m_pub.group(1)
          base_code = int(m_pub.group(2))
          print(f"pubspec.yaml version={expected_name}+{base_code}")

          expected_apks = {
              "armeabi-v7a": pathlib.Path(f"artifacts/duoyi-{suffix}-armeabi-v7a.apk"),
              "arm64-v8a": pathlib.Path(f"artifacts/duoyi-{suffix}-arm64-v8a.apk"),
              "x86_64": pathlib.Path(f"artifacts/duoyi-{suffix}-x86_64.apk"),
              "universal": pathlib.Path(f"artifacts/duoyi-{suffix}.apk"),
          }

          all_staged = sorted(pathlib.Path("artifacts").glob("*.apk"))
          if not all_staged:
              raise SystemExit("ERROR: No staged APKs found in artifacts/")

          codes = {}
          names = {}
          for apk in all_staged:
              out = subprocess.check_output([aapt2, "dump", "badging", str(apk)], text=True)
              m_pkg = re.search(r"versionCode='(\d+)'\s+versionName='([^']*)'", out)
              if not m_pkg:
                  raise SystemExit(
                      f"ERROR: Could not parse versionCode/versionName from {apk}:\n{out[:400]}"
                  )
              vcode = int(m_pkg.group(1))
              vname = m_pkg.group(2)
              print(f"APK {apk.name}: versionName={vname} versionCode={vcode}")
              codes[apk.name] = vcode
              names[apk.name] = vname

          for label, path in expected_apks.items():
              if not path.is_file():
                  raise SystemExit(f"ERROR: Missing expected staged APK for {label}: {path}")
              if names[path.name] != expected_name:
                  raise SystemExit(
                      f"ERROR: {path.name} versionName={names[path.name]!r} != pubspec {expected_name!r}"
                  )

          v7a = codes[expected_apks["armeabi-v7a"].name]
          arm64 = codes[expected_apks["arm64-v8a"].name]
          x86_64 = codes[expected_apks["x86_64"].name]
          universal = codes[expected_apks["universal"].name]

          assert v7a > 144012, f"v7a versionCode {v7a} must be strictly > 144012"
          assert v7a >= 1500001, f"v7a versionCode {v7a} must be >= 1500001"
          assert v7a < arm64 < x86_64 < universal, (
              f"Expected v7a < arm64 < x86_64 < universal, got "
              f"v7a={v7a}, arm64={arm64}, x86_64={x86_64}, universal={universal}"
          )
          assert v7a == base_code + 1, f"Expected v7a == {base_code + 1}, got {v7a}"
          assert arm64 == base_code + 2, f"Expected arm64 == {base_code + 2}, got {arm64}"
          assert x86_64 == base_code + 4, f"Expected x86_64 == {base_code + 4}, got {x86_64}"
          assert universal == base_code + 9, f"Expected universal == {base_code + 9}, got {universal}"
          print(
              f"PASS: versionCodes verified (base={base_code}: "
              f"v7a={v7a} < arm64={arm64} < x86_64={x86_64} < universal={universal})"
          )
          PY

      - name: Print signing fingerprint
        run: |
          APK="$(ls artifacts/*.apk 2>/dev/null | head -n 1 || true)"
          if [ -n "$APK" ]; then
            echo "Verifying APK signing identity of $APK:"
            "$JAVA_HOME/bin/keytool" -printcert -jarfile "$APK" | grep -E 'SHA256|Owner|Issuer' || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duoyi-android
          path: artifacts/*
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/keys/duoyi-release.jks android/key.properties

  # ─────────────────────────────────────────────
  # 3. Web (optional)
  # ─────────────────────────────────────────────
  web:
    needs: analyze
    if: >
      github.ref == 'refs/heads/main'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_web == 'true')
      || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DUOYI_SERVER_URL: ${{ github.event.inputs.server_url || vars.DUOYI_SERVER_URL || '' }}
      DUOYI_WEB_BASE_HREF: ${{ vars.DUOYI_WEB_BASE_HREF || '/duoyi/' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get packages
        run: flutter pub get

      - name: Build web (release)
        run: |
          BUILD_ARGS=(--release --base-href "$DUOYI_WEB_BASE_HREF")
          if [ -n "$DUOYI_SERVER_URL" ]; then
            BUILD_ARGS+=(--dart-define=DUOYI_SERVER_URL="$DUOYI_SERVER_URL")
          fi
          rm -rf build/web build/web-desktop build/web-mobile
          flutter build web "${BUILD_ARGS[@]}" --dart-define=DUOYI_WEB_TARGET=desktop
          mv build/web build/web-desktop
          flutter build web "${BUILD_ARGS[@]}" --dart-define=DUOYI_WEB_TARGET=mobile
          mv build/web build/web-mobile

      - name: Package web
        run: |
          rm -rf web-artifacts
          mkdir -p web-artifacts
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF##refs/tags/}"
          else
            SUFFIX="$(date +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          tar -czf "web-artifacts/duoyi-web-$SUFFIX.tar.gz" -C build/web-desktop .
          tar -czf "web-artifacts/duoyi-web-desktop-$SUFFIX.tar.gz" -C build/web-desktop .
          tar -czf "web-artifacts/duoyi-web-mobile-$SUFFIX.tar.gz" -C build/web-mobile .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: duoyi-web
          path: web-artifacts/*
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web-desktop

  # ─────────────────────────────────────────────
  # 4. GitHub Pages (main branch only)
  # ─────────────────────────────────────────────
  deploy-pages:
    needs: web
    if: github.ref == 'refs/heads/main' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────
  # 5. Release (tag push only)
  # ─────────────────────────────────────────────
  release:
    needs: [android, web]
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: duoyi-android
          path: dist

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: duoyi-web
          path: dist

      - name: List artifacts
        run: ls -R dist

      - name: Resolve release notes
        id: release_notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/releases/${TAG}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
          else
            echo "No release notes found for $TAG; generated notes will be used."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body_path: ${{ steps.release_notes.outputs.body_path }}
          generate_release_notes: true
          fail_on_unmatched_files: false
